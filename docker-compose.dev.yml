name: simple_drf_blog-dev

x-app-image-builder: &app-image-builder
  image: simple_drf_blog:latest
  build:
    context: .
    dockerfile: ./Dockerfile
    target: runtime-dev

x-logging-template: &logging-template
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-app-base: &app-base
  <<: [ *app-image-builder, *logging-template ]

services:
  db:
    <<: *logging-template
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    networks:
      - backend
    volumes:
      - mariadb_data_dev:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    <<: *logging-template
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks:
      - backend
    volumes:
      - redis_data_dev:/data
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *app-base
    restart: "no"
    working_dir: /app/src
    networks:
      - backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "manage.py", "migrate", "--noinput" ]

  web:
    <<: *app-base
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    networks:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - media_files_dev:/app/src/media
      - static_files_dev:/app/src/staticfiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [ "python", "manage.py", "runserver", "0.0.0.0:8000" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_worker:
    <<: *app-base
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    networks:
      - backend
    volumes:
      - ./.env:/app/.env:ro
      - media_files_dev:/app/src/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [ "celery", "-A", "config", "worker", "-l", "info" ]

  celery_beat:
    <<: *app-base
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    networks:
      - backend
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: [ "celery", "-A", "config", "beat", "-l", "info" ]

volumes:
  mariadb_data:
  media_files:
  static_files:
  redis_data:

networks:
  backend:
