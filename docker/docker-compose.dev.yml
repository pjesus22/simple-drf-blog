services:
  db:
    image: mariadb:lts
    container_name: simple_drf_blog-dev-mariadb
    restart: unless-stopped
    env_file:
      - ../envs/.env.dev.db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_dev:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/dockerfile.dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - PYTHONPATH=/app/src
    env_file:
      - ../envs/.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - venv_data:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "
        until python src/manage.py check --database default 2>/dev/null; do
          echo 'Waiting for the database...';
          sleep 2;
        done;
        python src/manage.py migrate &&
        python src/manage.py runserver 0.0.0.0:8000
      "

  celery_worker:
    build:
      context: ..
      dockerfile: docker/dockerfile.dev
    working_dir: /app/src
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - PYTHONPATH=/app/src
    env_file:
      - ../envs/.env.dev
    volumes:
      - ..:/app
      - venv_data:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "celery -A config worker -l info"

volumes:
  mariadb_dev:
  venv_data:
