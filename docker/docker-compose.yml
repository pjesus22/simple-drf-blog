services:
  db:
    image: mariadb:11.8
    container_name: simple_drf_blog-prod-mariadb
    restart: unless-stopped
    env_file:
      - ../envs/.env.prod.db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: simple_drf_blog-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: simple_drf_blog:latest
    container_name: simple_drf_blog-migrate_service
    restart: "no"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PYTHONPATH: /app/src
    volumes:
      - ../envs/.env.prod:/app/.env.prod:ro
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "src/manage.py", "migrate", "--noinput" ]

  web:
    image: simple_drf_blog:latest
    container_name: simple_drf_blog-prod-web
    build:
      context: ..
      dockerfile: docker/dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PYTHONPATH: /app/src
    volumes:
      - ../envs/.env.prod:/app/.env.prod:ro
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    image: simple_drf_blog:latest
    container_name: simple_drf_blog-celery_worker
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - ../envs/.env.prod:/app/.env.prod:ro
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [ "celery", "-A", "config", "worker", "-l", "info" ]

  celery_beat:
    image: simple_drf_blog:latest
    container_name: simple_drf_blog-celery_beat
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - ../envs/.env.prod:/app/.env.prod:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: [ "celery", "-A", "config", "beat", "-l", "info" ]

  nginx:
    image: nginx:1.27.5-alpine
    container_name: simple_drf_blog-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      # Self-signed cert (default). Swap this mount for Let's Encrypt:
      #   - /etc/letsencrypt:/etc/letsencrypt:ro
      # Or for a paid/custom cert:
      #   - ../nginx/certs/custom:/etc/nginx/certs/custom:ro
      - ../nginx/certs/self-signed:/etc/nginx/certs/self-signed:ro
      # Let's Encrypt ACME challenge webroot
      - certbot_webroot:/var/www/certbot
      # Shared static/media with the web container
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  mariadb_data:
  media_files:
  static_files:
  certbot_webroot:
