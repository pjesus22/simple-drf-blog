x-app-image-builder: &app-image-builder
  image: simple_drf_blog:latest
  build:
    context: .
    dockerfile: ./Dockerfile

x-logging-template: &logging-template
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-app-base: &app-base
  <<: [ *app-image-builder, *logging-template ]

services:
  db:
    <<: *logging-template
    image: mariadb:11.8
    container_name: simple_drf_blog-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    networks:
      - backend
    volumes:
      - mariadb_data:/var/lib/mysql
    # BACKUP STRATEGY:
    # Named volumes are used for native I/O performance and to avoid host
    # permission conflicts.
    # To backup:
    # docker exec simple_drf_blog-prod-mariadb mariadb-dump -u root \
    #   -p"$$MARIADB_ROOT_PASSWORD" --all-databases > backup.sql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    <<: *logging-template
    image: redis:7.4-alpine
    container_name: simple_drf_blog-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks:
      - backend
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *app-base
    container_name: simple_drf_blog-migrate_service
    restart: "no"
    working_dir: /app/src
    networks:
      - backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      COLLECT_STATIC: "1"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "manage.py", "migrate", "--noinput" ]

  web:
    <<: *app-base
    container_name: simple_drf_blog-web
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    networks:
      - backend
      - frontend
    volumes:
      - ./.env:/app/.env:ro
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    <<: *app-base
    container_name: simple_drf_blog-celery_worker
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    networks:
      - backend
    volumes:
      - ./.env:/app/.env:ro
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: [ "celery", "-A", "config", "worker", "-l", "info" ]

  celery_beat:
    <<: *app-base
    container_name: simple_drf_blog-celery_beat
    restart: unless-stopped
    working_dir: /app/src
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    networks:
      - backend
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: [ "celery", "-A", "config", "beat", "-l", "info" ]

  nginx:
    <<: *logging-template
    image: nginx:1.27.5-alpine
    container_name: simple_drf_blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Self-signed cert (default). Swap this mount for Let's Encrypt:
      #   - /etc/letsencrypt:/etc/letsencrypt:ro
      # Or for a paid/custom cert:
      #   - ../nginx/certs/custom:/etc/nginx/certs/custom:ro
      - ./nginx/certs/self-signed:/etc/nginx/certs/self-signed:ro
      # Let's Encrypt ACME challenge webroot
      - certbot_webroot:/var/www/certbot
      # Shared static/media with the web container
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  mariadb_data:
  media_files:
  static_files:
  certbot_webroot:
  redis_data:

networks:
  backend:
  frontend:
